
// Build.gradle generated for instrumentation module camel-jms-4.0.0

apply plugin: 'java'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}



dependencies {
  
  implementation 'org.apache.camel:camel-jms:4.0.0'
	implementation 'javax.jms:javax.jms-api:2.0'

   // New Relic Labs Labs Java Agent dependencies
   implementation 'com.newrelic.agent.java:newrelic-agent:' + project.findProperty('java.agent.version')
   implementation 'com.newrelic.agent.java:newrelic-api:' + project.findProperty('java.agent.version')
   implementation 'com.newrelic.agent.java:agent-bridge:' + project.findProperty('java.agent.version')
}

jar {
  manifest {
    attributes 'Implementation-Title': 'com.newrelic.instrumentation.labs.camel-jms-4.0.0'
    attributes 'Implementation-Vendor': 'New Relic Labs'
    attributes 'Implementation-Vendor-Id': 'com.newrelic.labs'
    attributes 'Implementation-Version': 1.0
  }
}

verifyInstrumentation {
  passesOnly 'org.apache.camel:camel-jms:[4.0.0,)'
  excludeRegex '.*M[1-9]'
  excludeRegex '.*RC[1-9]'
}
